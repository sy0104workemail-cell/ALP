services:
  - type: web
    name: leave-planner
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: TRUST_PROXY
        value: "1"
      - key: EDIT_CODE
        sync: false
    disk:
      name: leave-data
      mountPath: /var/data
      sizeGB: 1
